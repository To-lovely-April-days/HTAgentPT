<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #ffffff; color: #1c2530;
      font-family: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #2f5ccc; text-decoration: none; }
    a:hover { color: #1f43a0; }
    .m { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .hd { height: 52px; display: flex; align-items: center; gap: 11px; padding: 0 16px; border-bottom: 1px solid #e2e6ec; }
    .pbtn { height: 44px; display: flex; align-items: center; justify-content: center; gap: 7px;
      border-radius: 8px; font-size: 15px; font-weight: 500; color: #ffffff; background: #2f5ccc; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #ffffff; overflow: hidden;">

  <div class="hd">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#1c2530" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg>
    <div style="font-size: 15px; font-weight: 600;">报警代码 E-17</div>
  </div>

  <div style="flex-grow: 1; overflow-y: auto;">

    <div style="padding: 18px 16px 6px;">
      <div style="display: inline-flex; align-items: center; height: 26px; padding: 0 9px; border-radius: 5px; font-size: 13px; font-weight: 600; background: #fdeceb; color: #b3261e; margin-bottom: 12px;" class="m">E-17</div>
      <div style="font-size: 19px; font-weight: 600; line-height: 1.45; margin-bottom: 8px;">搅拌电机过载保护动作</div>
      <div style="font-size: 15px; line-height: 1.8; color: #3c4653;">电机电流超过设定上限，控制器为保护电机自动停机。多数情况下是搅拌阻力变大造成的，不是电机本身损坏。</div>
    </div>

    <div style="padding: 16px 16px 8px;">
      <div style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">您可以先这样排查</div>
      <div style="font-size: 12.5px; color: #8a95a3; line-height: 1.6;">以下步骤不需要拆卸设备，请在停机泄压后进行。</div>
    </div>

    <div style="padding: 0 16px;">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid #eef1f5;">
          <span class="m" style="flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; font-size: 12.5px; font-weight: 500; background: #eef2fd; color: #2f5ccc;">{{s.n}}</span>
          <div style="flex-grow: 1; min-width: 0;">
            <div style="font-size: 15px; line-height: 1.65;">{{s.what}}</div>
            <div style="font-size: 13px; color: #5a6673; line-height: 1.7; margin-top: 4px;">{{s.why}}</div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="padding: 18px 16px 8px;">
      <div style="padding: 14px 15px; background: #fdf4e3; border: 1px solid #f0dcb4; border-radius: 8px;">
        <div style="font-size: 14px; font-weight: 600; color: #8a5a00; line-height: 1.5; margin-bottom: 5px;">这些情况请直接报修</div>
        <div style="font-size: 13px; color: #8a5a00; line-height: 1.8;">复位后仍立即跳停 · 电机有焦糊味或异响 · 釜体有介质渗出 · 压力表读数异常</div>
      </div>
    </div>

    <div style="padding: 14px 16px 8px;">
      <div class="pbtn">仍未解决，提交报修</div>
    </div>

    <div style="padding: 16px 16px 24px;">
      <div style="font-size: 12px; color: #8a95a3; line-height: 1.75;">资料来源：CJF 系列高压反应釜使用说明书　第 5 章 故障处理<br>本页内容由厂家审定后发布，最后更新 2025-08</div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      steps: [
        { n: 1, what: '按面板上的复位键，观察能否重新启动', why: '若能启动并持续运行，多为一次性阻力波动，留意后续是否复发。' },
        { n: 2, what: '确认釜内介质温度是否偏低', why: '低温下介质黏度上升，启动瞬间阻力大。可先升温至 40 ℃ 再启动搅拌。' },
        { n: 3, what: '把转速调低到 600 rpm 再试', why: '高黏度物料在高转速下更容易触发过载。' },
        { n: 4, what: '查看上次保养记录，确认耦合轴承是否超期', why: '轴承运行超过 1,800 小时后，卡滞风险明显上升，需要更换。' }
      ]
    };
  }
}
</script>
</body>
</html>
