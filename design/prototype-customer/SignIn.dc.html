<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #ffffff; color: #1c2530;
      font-family: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #2f5ccc; text-decoration: none; }
    a:hover { color: #1f43a0; }
    .m { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .hd { height: 52px; display: flex; align-items: center; gap: 11px; padding: 0 16px; border-bottom: 1px solid #e2e6ec; }
    .fl { font-size: 13.5px; font-weight: 500; margin-bottom: 7px; }
    .inp { height: 44px; display: flex; align-items: center; padding: 0 13px;
      background: #ffffff; border: 1px solid #cfd6df; border-radius: 8px; font-size: 16px; }
    .pbtn { height: 44px; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; font-size: 15px; font-weight: 500; color: #ffffff; background: #2f5ccc; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #ffffff; overflow: hidden;">

  <div class="hd">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#1c2530" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg>
    <div style="font-size: 15px; font-weight: 600;">登录</div>
  </div>

  <div style="flex-grow: 1; overflow-y: auto; padding: 26px 16px 20px;">

    <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 26px;">
      <div style="width: 44px; height: 44px; border-radius: 10px; background: #2f5ccc; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; margin-bottom: 12px;">HT</div>
      <div style="font-size: 17px; font-weight: 600; line-height: 1.4;">霍桐实验仪器</div>
      <div style="font-size: 13px; color: #5a6673; margin-top: 4px;">客户服务</div>
    </div>

    <div style="margin-bottom: 16px;">
      <div class="fl">手机号</div>
      <div class="inp m" style="color: #a2acb9;">开通账号时登记的手机号</div>
    </div>

    <div style="margin-bottom: 20px;">
      <div class="fl">口令</div>
      <div class="inp m" style="color: #a2acb9;">工程师告知的初始口令</div>
    </div>

    <div class="pbtn" style="margin-bottom: 18px;">登录</div>

    <div style="padding: 14px 15px; background: #f8fafc; border: 1px solid #e9edf2; border-radius: 8px; margin-bottom: 16px;">
      <div style="font-size: 13.5px; font-weight: 500; line-height: 1.5; margin-bottom: 5px;">没有账号？</div>
      <div style="font-size: 13px; color: #5a6673; line-height: 1.8;">账号由为您服务的售后工程师在处理报修时开通。<strong style="font-weight:600">不登录也能用</strong>——自助查询、常见问题、提交报修、凭单号查进度都不需要账号。</div>
    </div>

    <div style="font-size: 13px; color: #5a6673; line-height: 1.8;">忘记口令请联系为您服务的工程师重置。出于安全考虑，本系统不提供自助找回。</div>

    <div style="margin-top: 26px; padding-top: 16px; border-top: 1px solid #eef1f5;">
      <div style="font-size: 12px; color: #8a95a3; line-height: 1.85;">
        服务热线 400-XXX-XXXX　·　工作日 8:30–17:30<br>
        沪ICP备XXXXXXXX号
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
