<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #ffffff; color: #1c2530;
      font-family: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #2f5ccc; text-decoration: none; }
    a:hover { color: #1f43a0; }
    .m { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .hd { height: 52px; display: flex; align-items: center; gap: 11px; padding: 0 16px; border-bottom: 1px solid #e2e6ec; }
    .fl { font-size: 13.5px; font-weight: 500; margin-bottom: 7px; }
    .inp { min-height: 44px; display: flex; align-items: center; padding: 0 13px;
      background: #ffffff; border: 1px solid #cfd6df; border-radius: 8px; font-size: 16px; }
    .ta { padding: 11px 13px; background: #ffffff; border: 1px solid #cfd6df; border-radius: 8px;
      font-size: 16px; line-height: 1.7; }
    .pbtn { height: 44px; display: flex; align-items: center; justify-content: center; gap: 7px;
      border-radius: 8px; font-size: 15px; font-weight: 500; color: #ffffff; background: #2f5ccc; }
    .sbtn { height: 44px; display: flex; align-items: center; justify-content: center; gap: 7px;
      border-radius: 8px; font-size: 15px; color: #2f5ccc; background: #ffffff; border: 1px solid #c9d6f6; }
    .fg { margin-bottom: 16px; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #ffffff; overflow: hidden;">

  <div class="hd">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#1c2530" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg>
    <div style="font-size: 15px; font-weight: 600;">{{v.title}}</div>
  </div>

  <!-- 填写 -->
  <sc-if value="{{v.isForm}}" hint-placeholder-val="{{ true }}">
    <div style="flex-grow: 1; overflow-y: auto; padding: 18px 16px 20px;">
      <div class="fg">
        <div class="fl">设备编号</div>
        <div class="inp m" style="color: #a2acb9;">HT-XXXXX-XXXX-XXXX-XX</div>
        <div style="font-size: 12.5px; color: #2f5ccc; line-height: 1.6; margin-top: 7px; min-height: 24px; display: flex; align-items: center;">设备编号在哪里？ →</div>
      </div>

      <div class="fg">
        <div class="fl">哪里出了问题</div>
        <div class="ta" style="color: #a2acb9; min-height: 110px;">请描述现象：什么时候开始的、面板上有没有报警代码、有没有异响或渗漏。写得越具体，工程师准备得越充分。</div>
      </div>

      <div class="fg">
        <div class="fl">怎么联系您</div>
        <div style="display: flex; flex-direction: column; gap: 9px;">
          <div class="inp" style="color: #a2acb9;">称呼</div>
          <div class="inp" style="color: #a2acb9;">手机号</div>
        </div>
      </div>

      <div style="padding: 13px 14px; background: #f8fafc; border: 1px solid #e9edf2; border-radius: 8px; margin-bottom: 18px;">
        <div style="font-size: 12.5px; color: #5a6673; line-height: 1.8;">提交后会生成一个报修单号。<strong style="font-weight:600">请记下这个单号</strong>，凭它可以随时查询处理进度，不需要账号。</div>
      </div>

      <div class="pbtn">提交报修</div>
    </div>
  </sc-if>

  <!-- 提交成功：单号是页面主体 -->
  <sc-if value="{{v.isDone}}" hint-placeholder-val="{{ false }}">
    <div style="flex-grow: 1; overflow-y: auto; padding: 26px 16px 20px;">
      <div style="display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 24px;">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1c6b45" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 13px;"><circle cx="12" cy="12" r="9.5"/><path d="M7.6 12.2l3 3 5.8-6"/></svg>
        <div style="font-size: 19px; font-weight: 600; line-height: 1.45; margin-bottom: 6px;">已收到您的报修</div>
        <div style="font-size: 14px; color: #5a6673; line-height: 1.7;">工程师会在一个工作日内与您联系。</div>
      </div>

      <div style="padding: 20px 16px; background: #f8fafc; border: 1px solid #e2e6ec; border-radius: 10px; text-align: center; margin-bottom: 16px;">
        <div style="font-size: 12.5px; color: #8a95a3; margin-bottom: 9px;">报修单号</div>
        <div class="m" style="font-size: 24px; font-weight: 600; letter-spacing: 0.02em; line-height: 1.3; margin-bottom: 14px;">WO-2025-0891</div>
        <div style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: 8px; font-size: 15px; font-weight: 500; color: #2f5ccc; background: #ffffff; border: 1px solid #c9d6f6;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V3A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h1.5"/></svg>
          <span>复制单号</span>
        </div>
      </div>

      <div style="padding: 13px 14px; background: #fdf4e3; border: 1px solid #f0dcb4; border-radius: 8px; margin-bottom: 18px;">
        <div style="font-size: 13px; color: #8a5a00; line-height: 1.8;">这个单号是您查询进度的唯一凭据，请复制保存。工程师上门处理时也会用到它。</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div class="pbtn">查看处理进度</div>
        <div class="sbtn">返回首页</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>

<script data-dc-script data-props='{
  "state": {"editor": "enum", "default": "填写", "options": ["填写", "提交成功"], "section": "状态"}
}'>
class Component extends DCLogic {
  renderVals() {
    const done = (this.props.state ?? '填写') === '提交成功';
    return {
      v: {
        isForm: !done,
        isDone: done,
        title: done ? '报修已提交' : '提交报修'
      }
    };
  }
}
</script>
</body>
</html>
