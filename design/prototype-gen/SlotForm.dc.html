<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #f2f4f7; color: #1c2530;
      font-family: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #2f5ccc; text-decoration: none; }
    a:hover { color: #1f43a0; }
    .m { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .sc { overflow-y: auto; scrollbar-width: thin; scrollbar-color: #cfd6df transparent; }
    .sc::-webkit-scrollbar { width: 8px; }
    .sc::-webkit-scrollbar-thumb { background: #cfd6df; border-radius: 4px; }
    .n { height: 28px; padding: 0 11px; display: flex; align-items: center; border-radius: 4px; font-size: 13px; color: #5a6673; }
    .non { height: 28px; padding: 0 11px; display: flex; align-items: center; border-radius: 4px; font-size: 13px; font-weight: 500; color: #2f5ccc; background: #eef2fd; }
    .pill { display: inline-flex; align-items: center; height: 19px; padding: 0 6px; border-radius: 3px; font-size: 11px; font-weight: 500; }
    .gbtn { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 4px;
      font-size: 12px; color: #5a6673; background: #ffffff; border: 1px solid #dde3ea; cursor: pointer; }
    .req { color: #b3261e; }
    .why { font-size: 11.5px; line-height: 1.75; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #f2f4f7; overflow: hidden;">

  <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 28px; padding: 0 16px; background: #ffffff; border-bottom: 1px solid #e2e6ec;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <div style="width: 24px; height: 24px; border-radius: 4px; background: #2f5ccc; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; letter-spacing: .03em;">HT</div>
      <div style="font-size: 14px; font-weight: 600;">霍桐实验仪器 · 企业智能体</div>
    </div>
    <div style="display: flex; align-items: center; gap: 2px;">
      <div class="n">问答</div><div class="n">项目查询</div><div class="non">方案生成</div><div class="n">报价合同</div><div class="n">翻译</div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #e6ebf2; color: #5a6673; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500;">张</div>
      <div style="line-height: 1.25;"><div style="font-size:12px;font-weight:500">张伟</div><div style="font-size:11px;color:#8a95a3">售前工程师</div></div>
    </div>
  </div>

  <!-- 顶部常驻：进度 + 生成按钮 -->
  <div style="height: 66px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 18px; background: #ffffff; border-bottom: 1px solid #e2e6ec;">
    <div style="min-width: 0;">
      <div style="font-size: 13.5px; font-weight: 600; line-height: 1.4;">技术方案 · 华东理工大学 5L 高压釜</div>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 3px;">
        <span style="font-size: 11.5px; color: #8a95a3;">基准</span>
        <span class="m" style="font-size: 11.5px; color: #2f5ccc;">2025-0312</span>
        <span style="font-size: 11.5px; color: #2f5ccc; cursor: pointer;">更换</span>
      </div>
    </div>
    <div style="width: 280px; flex-shrink: 0;">
      <div style="display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px;">
        <span class="m" style="font-size: 15px; font-weight: 600;">46</span>
        <span style="font-size: 11.5px; color: #8a95a3;">/ 58 已完成</span>
      </div>
      <div style="height: 5px; border-radius: 3px; background: #eef1f5; overflow: hidden; display: flex;">
        <div style="width: 79%; background: #1c6b45;"></div>
        <div style="width: 5%; background: #6b4fbb;"></div>
      </div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="{{v.allBtn}}" onClick="{{pickAll}}">全部槽位 <span class="m">58</span></div>
    <div style="{{v.todoBtn}}" onClick="{{pickTodo}}">仅待填 <span class="m">12</span></div>
    <div style="width: 1px; height: 22px; background: #e2e6ec;"></div>
    <div style="text-align: right;">
      <div style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 16px;border-radius:5px;font-size:13px;font-weight:500;color:#ffffff;background:#a8b4c4;cursor:not-allowed;">生成文档</div>
      <div style="font-size: 11px; color: #b3261e; margin-top: 4px;">还有 3 项必填未完成</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; min-height: 0;">

    <!-- 章节导航 -->
    <div class="sc" style="width: 250px; flex-shrink: 0; background: #ffffff; border-right: 1px solid #e2e6ec; padding: 12px 0 16px;">
      <div style="padding: 4px 16px 8px; font-size: 11px; font-weight: 500; color: #8a95a3; letter-spacing: .04em;">章节</div>
      <sc-for list="{{secs}}" as="x" hint-placeholder-count="6">
        <div style="{{x.row}}">
          <span style="flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{x.name}}</span>
          <span style="{{x.badge}}">{{x.done}}/{{x.total}}</span>
        </div>
      </sc-for>
      <div style="margin: 12px 16px 0; padding-top: 12px; border-top: 1px solid #eef1f5;">
        <div style="font-size: 11px; font-weight: 500; color: #8a95a3; letter-spacing: .04em; margin-bottom: 8px;">来源标记</div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <sc-for list="{{legend}}" as="g" hint-placeholder-count="5">
            <div style="display: flex; align-items: center; gap: 7px;">
              <span style="{{g.style}}">{{g.name}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <!-- 槽位表单 -->
    <div class="sc" style="flex-grow: 1; min-width: 0; padding: 16px 20px 24px;">
      <div style="max-width: 900px;">

        <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 12px;">
          <span style="font-size: 14px; font-weight: 600;">2　设计依据</span>
          <span style="font-size: 11.5px; color: #8a95a3;">{{v.hint}}</span>
        </div>

        <sc-for list="{{slots}}" as="s" hint-placeholder-count="9">
          <div style="{{s.card}}">

            <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 9px;">
              <span style="font-size: 13.5px; font-weight: 600;">{{s.name}}</span>
              <sc-if value="{{s.required}}" hint-placeholder-val="{{ true }}">
                <span class="req" style="font-size: 13px;">*</span>
              </sc-if>
              <span class="m" style="font-size: 10.5px; color: #a2acb9;">{{s.key}}</span>
              <div style="flex-grow: 1;"></div>
              <span style="{{s.markStyle}}">{{s.mark}}</span>
            </div>

            <div style="{{s.valueStyle}}">{{s.value}}</div>

            <sc-if value="{{s.hasWhy}}" hint-placeholder-val="{{ true }}">
              <div style="{{s.whyBox}}">
                <div class="why">{{s.why}}</div>
                <sc-if value="{{s.hasRefs}}" hint-placeholder-val="{{ true }}">
                  <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;">
                    <sc-for list="{{s.refs}}" as="r" hint-placeholder-count="3">
                      <span style="{{r.style}}">{{r.no}}</span>
                    </sc-for>
                  </div>
                </sc-if>
              </div>
            </sc-if>

            <sc-if value="{{s.hasActions}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; align-items: center; gap: 7px; margin-top: 10px;">
                <sc-for list="{{s.actions}}" as="a" hint-placeholder-count="3">
                  <span style="{{a.style}}">{{a.label}}</span>
                </sc-for>
                <div style="flex-grow: 1;"></div>
                <span style="font-size: 11px; color: #8a95a3; cursor: pointer;">就这一项追问</span>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "view": {"editor": "enum", "default": "全部槽位", "options": ["全部槽位", "仅待填"], "section": "视图"}
}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { view: null }; }

  renderVals() {
    const accent = '#2f5ccc';
    const soft = 'color-mix(in oklab, ' + accent + ' 9%, #ffffff)';
    const line = 'color-mix(in oklab, ' + accent + ' 26%, #ffffff)';
    const view = this.state.view || this.props.view || '全部槽位';
    const todo = view === '仅待填';
    const pill = 'display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:3px;font-size:11px;font-weight:500;';

    // 5.2.5 要求来源以文字与颜色区分。紫色为本批新增，语义是「待人工确认的未决状态」，
    // 不借用密级三色——那三色在 pill 形态下各自专表对应密级。
    const MARK = {
      '模板固定': 'background:#eef1f5;color:#5a6673;border:1px solid #dde3ea;',
      '继承自 2025-0312': 'background:#eef2fd;color:#2f5ccc;border:1px solid #c9d6f6;',
      'AI 建议待确认': 'background:#f1edfb;color:#6b4fbb;border:1px solid #d9cef2;',
      '已确认': 'background:#e6f2ec;color:#1c6b45;border:1px solid #c2ded1;',
      '待填 · 禁止继承': 'background:#ffffff;color:#8a5a00;border:1px dashed #f0dcb4;',
      '后续阶段': 'background:#f8fafc;color:#a2acb9;border:1px solid #e9edf2;'
    };

    const V = { plain: 'font-size:13px;line-height:1.8;color:#1c2530;',
                muted: 'font-size:13px;line-height:1.8;color:#a2acb9;',
                sug: 'font-size:13px;line-height:1.8;color:#6b4fbb;font-weight:500;' };

    const act = (kind) => kind === 'primary'
      ? 'display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:4px;font-size:12px;font-weight:500;color:#ffffff;background:#6b4fbb;cursor:pointer;'
      : 'display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:4px;font-size:12px;color:#5a6673;background:#ffffff;border:1px solid #dde3ea;cursor:pointer;';

    const ALL = [
      { key: 'design_std', name: '设计依据标准', req: true, mark: '模板固定', todo: false,
        value: 'GB 150.1~150.4《压力容器》 · GB/T 25198《压力容器封头》', vs: 'plain',
        why: '模板固定值，不参与继承也不提问。需要调整请在管理后台改模板。', whyTone: 'grey' },

      { key: 'customer_name', name: '客户名称', req: true, mark: '已确认', todo: false,
        value: '华东理工大学', vs: 'plain',
        why: '禁止继承项，由你填写后确认。客户名称、项目编号、报价金额、日期、联系人五类默认如此。', whyTone: 'grey' },

      { key: 'volume_l', name: '全容积', req: true, mark: '继承自 2025-0312', todo: false,
        value: '5 L', vs: 'plain',
        why: '出处：2025-0312 技术方案 V2 › 第 3 章 设计依据 › 3.1 基本参数 · 第 11 页', whyTone: 'blue' },

      { key: 'pressure_design', name: '设计压力', req: true, mark: 'AI 建议待确认', todo: true,
        value: '建议：12 MPa', vs: 'sug',
        why: '4 个同类项目中 3 个按使用压力 1.1 倍取值并上调至 0.5 MPa 整数倍。其中 2025-0312 因现场为甲类厂房，自 11 MPa 上浮至 12 MPa——本次工况相同。',
        whyTone: 'violet', refs: ['2025-0312', '2023-1140', '2024-0877'],
        actions: [['采纳', 'primary'], ['改后采纳', 'ghost'], ['忽略', 'ghost']] },

      { key: 'pressure_burst', name: '爆破压力', req: true, mark: 'AI 建议待确认', todo: true,
        value: '建议：30 MPa', vs: 'sug',
        why: '按设计压力 2.5 倍校核。12 × 2.5 = 30 MPa。4 个同类项目一致采用该系数。',
        whyTone: 'violet', refs: ['2025-0312', '2023-1140', '2024-0877', '2024-0512'],
        actions: [['采纳', 'primary'], ['改后采纳', 'ghost'], ['忽略', 'ghost']] },

      { key: 'material', name: '主体材质', req: true, mark: 'AI 建议待确认', todo: true,
        value: '建议：釜体及釜盖采用 316L 不锈钢，内壁镜面抛光至 Ra ≤ 0.4 μm；密封面堆焊 Inconel 625；与介质接触的搅拌桨、测温套管同为 316L。',
        vs: 'sug',
        why: '由基准项目 2025-0312 对应章节改写而来。改写范围限于替换已变更的参数与表述，技术结论未改动——抛光等级与堆焊材料均沿用原文。',
        whyTone: 'violet', refs: ['2025-0312'],
        actions: [['采纳', 'primary'], ['对比基准原文', 'ghost'], ['改后采纳', 'ghost']] },

      { key: 'footprint', name: '占地尺寸要求', req: false, mark: '待填 · 禁止继承', todo: true,
        value: '暂无可参考数据，请自行填写', vs: 'muted',
        why: '客户现场条件，不可从历史项目继承。已检索同类项目，未找到可作为依据的内容——此时不会由模型凭常识给建议。', whyTone: 'amber' },

      { key: 'unit_price', name: '单价', req: true, mark: '待填 · 禁止继承', todo: true,
        value: '', vs: 'plain',
        why: '报价金额属机密字段，默认禁止继承并强制转为提问。', whyTone: 'amber' },

      { key: 'production_date', name: '生产排产日期', req: false, mark: '后续阶段', todo: false,
        value: '本阶段留空，由生产人员在文档流转后填写', vs: 'muted',
        why: '填写阶段标记为「后续」的槽位不提问、不预填、不给建议，输出时留空。', whyTone: 'grey' }
    ];

    const TONE = {
      grey: 'margin-top:9px;padding:9px 11px;border-radius:4px;background:#f8fafc;border:1px solid #e9edf2;color:#5a6673;',
      blue: 'margin-top:9px;padding:9px 11px;border-radius:4px;background:' + soft + ';border:1px solid ' + line + ';color:#3c4653;',
      violet: 'margin-top:9px;padding:10px 12px;border-radius:4px;background:#f1edfb;border:1px solid #d9cef2;color:#4a3580;',
      amber: 'margin-top:9px;padding:9px 11px;border-radius:4px;background:#fdf4e3;border:1px solid #f0dcb4;color:#8a5a00;'
    };

    const shown = todo ? ALL.filter(function (s) { return s.todo; }) : ALL;

    const SECS = [
      { name: '1　项目概况', done: 5, total: 5 },
      { name: '2　设计依据', done: 4, total: 6, at: true },
      { name: '3　主体设备', done: 12, total: 14 },
      { name: '4　配套系统', done: 9, total: 11 },
      { name: '5　控制与电气', done: 8, total: 10 },
      { name: '6　交付与服务', done: 8, total: 12 }
    ];

    const tabBtn = (on) => 'display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:4px;font-size:12.5px;cursor:pointer;' +
      (on ? 'font-weight:500;color:' + accent + ';background:' + soft + ';border:1px solid ' + line + ';'
          : 'color:#5a6673;background:#ffffff;border:1px solid #dde3ea;');

    return {
      v: {
        allBtn: tabBtn(!todo), todoBtn: tabBtn(todo),
        hint: todo ? '只显示待填与待确认的槽位。可按任意顺序作答，不强制线性推进。'
                   : '每个槽位一行，右侧是来源标记。可按任意顺序作答，不强制线性推进。'
      },
      pickAll: () => this.setState({ view: '全部槽位' }),
      pickTodo: () => this.setState({ view: '仅待填' }),
      secs: SECS.map(function (x) {
        return {
          name: x.name, done: x.done, total: x.total,
          row: 'display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:12.5px;cursor:pointer;' +
            (x.at ? 'font-weight:500;color:' + accent + ';background:' + soft + ';' : 'color:#5a6673;'),
          badge: 'flex-shrink:0;font-family:\'IBM Plex Mono\', ui-monospace, Consolas, monospace;font-size:11px;' +
            (x.done === x.total ? 'color:#1c6b45;' : 'color:#8a95a3;')
        };
      }),
      legend: ['模板固定', '继承自 2025-0312', 'AI 建议待确认', '已确认', '待填 · 禁止继承'].map(function (n) {
        return { name: n, style: pill + MARK[n] };
      }),
      slots: shown.map(function (s) {
        return {
          key: s.key, name: s.name, required: s.req, mark: s.mark, value: s.value || '　',
          markStyle: pill + MARK[s.mark],
          valueStyle: V[s.vs],
          card: 'padding:14px 16px;border-radius:6px;margin-bottom:10px;background:#ffffff;border:1px solid ' +
            (s.mark === 'AI 建议待确认' ? '#d9cef2' : '#e2e6ec') + ';',
          hasWhy: !!s.why,
          why: s.why || '',
          whyBox: TONE[s.whyTone] || TONE.grey,
          hasRefs: !!(s.refs && s.refs.length),
          refs: (s.refs || []).map(function (r) {
            return {
              no: r,
              style: 'display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:3px;font-family:\'IBM Plex Mono\', ui-monospace, Consolas, monospace;font-size:11px;font-weight:500;background:#ffffff;color:#6b4fbb;border:1px solid #d9cef2;cursor:pointer;'
            };
          }),
          hasActions: !!(s.actions && s.actions.length),
          actions: (s.actions || []).map(function (a) {
            return { label: a[0], style: act(a[1]) };
          })
        };
      })
    };
  }
}
</script>
</body>
</html>
