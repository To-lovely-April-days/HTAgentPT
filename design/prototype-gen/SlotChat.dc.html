<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #f2f4f7; color: #1c2530;
      font-family: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #2f5ccc; text-decoration: none; }
    a:hover { color: #1f43a0; }
    .m { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .pill { display: inline-flex; align-items: center; height: 19px; padding: 0 6px; border-radius: 3px; font-size: 11px; font-weight: 500; }
    .gbtn { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: 4px;
      font-size: 12.5px; color: #5a6673; background: #ffffff; border: 1px solid #dde3ea; cursor: pointer; }
    .cite { display: inline-flex; align-items: center; justify-content: center; min-width: 15px; height: 15px;
      padding: 0 3px; margin: 0 2px; border-radius: 3px; font-family: "IBM Plex Mono", monospace; font-size: 10px;
      font-weight: 500; line-height: 1; vertical-align: 3px; background: #eef2fd; color: #2f5ccc; border: 1px solid #c9d6f6; }
  </style>
</helmet>

<div style="width: 720px; height: 680px; background: #f2f4f7; padding: 20px; overflow: hidden;">
  <div style="height: 100%; background: #ffffff; border: 1px solid #cfd6df; border-radius: 7px; display: flex; flex-direction: column; overflow: hidden;">

    <div style="flex-shrink: 0; padding: 15px 20px 13px; border-bottom: 1px solid #e2e6ec;">
      <div style="display: flex; align-items: center; gap: 9px;">
        <span style="font-size: 14px; font-weight: 600;">设计压力</span>
        <span class="m" style="font-size: 10.5px; color: #a2acb9;">pressure_design</span>
        <span class="pill" style="background:#f1edfb;color:#6b4fbb;border:1px solid #d9cef2;">AI 建议待确认</span>
        <div style="flex-grow: 1;"></div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8a95a3" stroke-width="1.6" stroke-linecap="round" style="cursor:pointer"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </div>
      <div style="font-size: 11.5px; color: #8a95a3; margin-top: 4px;">就这一项追问。对话不影响其他槽位的状态。</div>
    </div>

    <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 10px;">

      <div style="padding: 12px 14px; background: #f1edfb; border: 1px solid #d9cef2; border-radius: 6px; margin-bottom: 18px;">
        <div style="display: flex; align-items: baseline; gap: 9px; margin-bottom: 6px;">
          <span style="font-size: 11.5px; color: #6b4fbb;">当前建议</span>
          <span class="m" style="font-size: 16px; font-weight: 600; color: #4a3580;">12 MPa</span>
        </div>
        <div style="font-size: 11.5px; line-height: 1.75; color: #4a3580;">4 个同类项目中 3 个按使用压力 1.1 倍取值并上调至 0.5 MPa 整数倍。其中 2025-0312 因现场为甲类厂房自 11 MPa 上浮至 12 MPa。</div>
      </div>

      <sc-for list="{{turns}}" as="t" hint-placeholder-count="4">
        <div style="{{t.wrap}}">
          <div style="{{t.who}}">{{t.name}}</div>
          <div style="{{t.body}}">{{t.text}}</div>
          <sc-if value="{{t.hasSrc}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;">
              <sc-for list="{{t.srcs}}" as="sx" hint-placeholder-count="2">
                <span style="display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:3px;font-size:11px;background:#eef2fd;color:#2f5ccc;border:1px solid #c9d6f6;cursor:pointer;">{{sx.label}}</span>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>

      <div style="margin-top: 4px; padding: 11px 13px; background: #ffffff; border: 1px solid #cfd6df; border-radius: 6px;">
        <div style="font-size: 13px; color: #a2acb9; line-height: 1.6;">继续就这一项提问…</div>
      </div>
    </div>

    <div style="flex-shrink: 0; padding: 13px 20px; border-top: 1px solid #e2e6ec; background: #f8fafc;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="gbtn">换一个建议</div>
        <div style="flex-grow: 1;"></div>
        <div class="gbtn">采纳 11 MPa</div>
        <div style="display:inline-flex;align-items:center;height:28px;padding:0 13px;border-radius:5px;font-size:13px;font-weight:500;color:#ffffff;background:#6b4fbb;cursor:pointer;">采纳 12 MPa</div>
      </div>
      <div style="font-size: 11px; color: #8a95a3; line-height: 1.65; margin-top: 9px;">采纳后该槽位转为「已确认」，本次对话记入生成记录，可在追溯时看到当时问了什么。</div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ask = 'margin-bottom:16px;';
    const ansWrap = 'margin-bottom:16px;';
    return {
      turns: [
        { name: '张伟', text: '为什么是 12 不是 11？我们常规就是 11。', me: true, hasSrc: false, srcs: [] },
        { name: '', me: false, hasSrc: true,
          text: '常规确实是 11 MPa——使用压力 10 MPa 的 1.1 倍。这次给到 12 是因为识别到的要点里写了「防爆 2 区」。2025-0312 那个项目同样是甲类厂房，当时与客户技术确认后把设计压力上浮了一档，并在釜盖增设了氮气吹扫接口。同类项目中只有这一个有甲类厂房条件，所以样本只有一个。',
          srcs: [{ label: '2025-0312 技术方案 §3.2' }, { label: '2025-0312 台账' }] },
        { name: '张伟', text: '如果这次客户现场不是甲类厂房呢？', me: true, hasSrc: false, srcs: [] },
        { name: '', me: false, hasSrc: true,
          text: '那按常规取 11 MPa，与 2023-1140、2024-0877 一致。要改的话把上面「特殊要求」里的防爆条件去掉，我会重新给建议——不过防爆等级那几项也会跟着变，第 5 章控制与电气里有 3 个槽位是按防爆条件继承的。',
          srcs: [{ label: '2023-1140 技术方案 §3.2' }, { label: '2024-0877 技术方案 §3.1' }] }
      ].map(function (t) {
        return {
          name: t.me ? t.name : '依据知识库',
          text: t.text, hasSrc: t.hasSrc, srcs: t.srcs,
          wrap: t.me ? ask : ansWrap,
          who: 'font-size:11.5px;font-weight:500;margin-bottom:5px;color:' + (t.me ? '#5a6673' : '#8a95a3') + ';',
          body: t.me
            ? 'font-size:13.5px;line-height:1.75;color:#1c2530;'
            : 'font-size:13px;line-height:1.85;color:#3c4653;padding:12px 14px;background:#f8fafc;border:1px solid #e9edf2;border-radius:6px;'
        };
      })
    };
  }
}
</script>
</body>
</html>
